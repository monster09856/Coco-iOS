workflows:
  ios-release:
    name: Coco iOS Release
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: "com.patpat.patpatGame"
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.pub-cache
    scripts:
      - name: Set up keychain + auto-signing via ASC API
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Flutter pub get
        script: flutter pub get
      - name: Precache iOS artifacts
        script: flutter precache --ios
      - name: Generate iOS config + run pod install
        script: |
          # Run flutter build ios --config-only first so Generated.xcconfig
          # is created, then run pod install.
          flutter build ios --config-only --release --no-codesign
          cd ios
          pod install
      - name: Bump iOS build number
        script: |
          cd ios
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo 49)
          NEXT_BUILD=$((LATEST_BUILD_NUMBER + 1))
          echo "Bumping to build number $NEXT_BUILD"
          agvtool new-version -all "$NEXT_BUILD"
      - name: Build IPA (release) via Codemagic xcode-project
        script: |
          # First build the iOS app without code signing via Flutter, then
          # archive + sign via Codemagic's xcode-project CLI which picks up
          # the certificates/profile installed by `keychain add-certificates`
          # + `xcode-project use-profiles` in the auto-signing step.
          flutter build ios --release --no-codesign
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
        submit_to_app_store: false

  android-release:
    name: Coco Android Release
    max_build_duration: 90
    instance_type: linux_x2
    environment:
      flutter: stable
      groups:
        - play_store_credentials
      vars:
        PACKAGE_NAME: "com.patpat.game"
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.pub-cache
    scripts:
      - name: Decode upload keystore from env
        script: |
          # CM_KEYSTORE = base64-encoded keystore JKS (from
          # Codemagic env-group `play_store_credentials`)
          echo "$CM_KEYSTORE" | base64 --decode > $CM_BUILD_DIR/android/app/upload-keystore.jks
          cat > $CM_BUILD_DIR/android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
      - name: Flutter pub get
        script: flutter pub get
      - name: Bump Android version
        script: |
          # Latest version code from Play Console (internal track or production)
          LATEST=$(google-play get-latest-build-number \
            --package-name "$PACKAGE_NAME" \
            --tracks internal production || echo 0)
          NEXT_BUILD=$((LATEST + 1))
          echo "Android versionCode → $NEXT_BUILD"
          # Patch pubspec build number (Flutter uses version: x.y.z+BUILD)
          sed -i "s/^version: .*$/version: $(grep ^version pubspec.yaml | cut -d+ -f1 | awk '{print $2}')+$NEXT_BUILD/" pubspec.yaml
          cat pubspec.yaml | grep ^version
      - name: Build AAB (release, production-signed)
        script: |
          flutter build appbundle --release
      - name: Sanity check AAB
        script: |
          ls -lh build/app/outputs/bundle/release/app-release.aab
          # Verify it's signed with our upload key
          jarsigner -verify -verbose build/app/outputs/bundle/release/app-release.aab \
            | grep -E "jar verified|X.509" | head -3
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        # Switch to "production" once verification + first internal release pass.
        # Set release_status: completed for direct prod rollout, or use
        # rollout_fraction: 0.1 for 10% staged rollout.
        in_app_update_priority: 3
        changes_not_sent_for_review: false
